name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify production build
        run: npm run check

      - name: Build self-contained client plugins
        run: npm run build:plugins

      - name: Verify plugin build isolation and parity
        run: |
          npm test
          npm run test:plugins
          diff -qr dist plugin-package/codex/smu-elearn/mcp/dist
          diff -qr dist plugin-package/claude/smu-elearn/mcp/dist
          diff -q plugin-package/codex/smu-elearn/mcp/package.json plugin-package/claude/smu-elearn/mcp/package.json
          diff -q plugin-package/codex/smu-elearn/mcp/package-lock.json plugin-package/claude/smu-elearn/mcp/package-lock.json
          npm ls --omit=dev --depth=0 --prefix plugin-package/codex/smu-elearn/mcp
          npm ls --omit=dev --depth=0 --prefix plugin-package/claude/smu-elearn/mcp

      - name: Audit production dependencies
        run: npm audit --omit=dev
